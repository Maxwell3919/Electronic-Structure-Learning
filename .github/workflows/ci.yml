name: site-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Python smoke-test syntax
        run: >-
          python3 -m py_compile
          scripts/smoke-pages.py
          scripts/smoke-chapter02-pages.py
          scripts/smoke-chapter03-pages.py
          scripts/smoke-part02-ch06.py
          scripts/smoke-part02-ch07.py
          scripts/smoke-part02-ch08.py
          scripts/smoke-part03-ch10.py
          scripts/smoke-part03-ch11.py
          scripts/smoke-part04-ch12.py
          scripts/smoke-pages-ch19.py
          scripts/smoke-part05-ch20.py
          scripts/smoke-part05-ch21.py
          scripts/smoke-part06-ch25.py
          scripts/smoke-part06-ch26.py
          scripts/smoke-part07-app-a.py
          scripts/smoke-part07-app-b.py

      - name: Validate models and build static site
        run: npm run check
