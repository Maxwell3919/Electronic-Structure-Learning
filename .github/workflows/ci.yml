name: site-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Python smoke-test syntax
        run: python3 -m py_compile scripts/smoke-pages.py scripts/smoke-part02-ch06.py scripts/smoke-part03-ch10.py

      - name: Validate model and build static site
        run: npm run check
